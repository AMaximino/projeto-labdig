<!--
  Cenário animado para ficar em loop ao lado do jogo.
  Pensado para conforto sensorial: cores pastel, movimentos lentos e nada
  que pisque. Todas as animações têm período que divide 24 s, então o ciclo
  inteiro se repete exatamente a cada 24 s (o vídeo em loop é gerado a partir
  desta página por cenario/gerar_video.py).
  Para abrir: http://localhost:3000/cenario/ (com o backend rodando) e F11 para tela cheia.
-->
<style>
  html, body { margin: 0; height: 100%; background: #F6EFE0; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
  text { font-family: Manrope, "DM Sans", Arial, sans-serif; }

  .anima { transform-box: fill-box; transform-origin: center; }

  /* Nuvens: uma faixa de 1200 px que se repete e anda 1 período a cada 24 s */
  @keyframes nuvens { from { transform: translateX(-1200px); } to { transform: translateX(0); } }
  .nuvens { animation: nuvens 24s linear infinite; }
  @keyframes nuvensLentas { from { transform: translateX(-600px); } to { transform: translateX(0); } }
  .nuvens-longe { animation: nuvensLentas 24s linear infinite; }

  /* Sol respirando */
  @keyframes sol { 0%, 100% { transform: scale(1); opacity: .45; } 50% { transform: scale(1.06); opacity: .6; } }
  .brilho-sol { animation: sol 8s ease-in-out infinite; }

  /* Objetos subindo como bolhas */
  @keyframes subir {
    0% { transform: translateY(0); opacity: 0; }
    10% { opacity: .95; }
    82% { opacity: .95; }
    100% { transform: translateY(-1250px); opacity: 0; }
  }
  @keyframes balanco { 0%, 100% { transform: translateX(-26px) rotate(-6deg); } 50% { transform: translateX(26px) rotate(6deg); } }
  .sobe { animation: subir 24s linear infinite; }
  .balanca { animation: balanco 6s ease-in-out infinite; }

  /* Janelas acendendo devagar */
  @keyframes janela { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  .janela { animation: janela 8s ease-in-out infinite; }

  /* Carros na rua */
  @keyframes carro { from { transform: translateX(-420px); } to { transform: translateX(2340px); } }
  .carro { animation: carro 24s linear infinite; }
  @keyframes carroVolta { from { transform: translateX(2340px); } to { transform: translateX(-420px); } }
  .carro-volta { animation: carroVolta 24s linear infinite; }
  @keyframes roda { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .roda { animation: roda 1.5s linear infinite; }

  /* Moeda caindo no cofrinho */
  @keyframes cair {
    0% { transform: translateY(-150px); opacity: 0; }
    15% { opacity: 1; }
    62% { transform: translateY(0); opacity: 1; }
    72% { transform: translateY(26px); opacity: 0; }
    100% { transform: translateY(26px); opacity: 0; }
  }
  .moeda-cai { animation: cair 4s ease-in infinite; }
  @keyframes cofrinho { 0%, 58%, 100% { transform: scale(1); } 68% { transform: scale(1.04, .97); } 78% { transform: scale(1); } }
  .cofrinho { animation: cofrinho 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }

  /* Árvore de moedas */
  @keyframes folhas { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
  .copa { animation: folhas 6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes cresce { 0%, 100% { transform: scale(.82); } 50% { transform: scale(1.06); } }
  .fruto { animation: cresce 6s ease-in-out infinite; }

  /* Estrelinhas: brilho lento, nunca pisca */
  @keyframes estrela { 0%, 100% { opacity: .15; transform: scale(.8) rotate(0); } 50% { opacity: .85; transform: scale(1.1) rotate(20deg); } }
  .estrela { animation: estrela 6s ease-in-out infinite; }

  /* Frases trocando devagar (4 frases, 6 s cada, 24 s no total) */
  @keyframes frase { 0% { opacity: 0; transform: translateY(14px); } 5%, 20% { opacity: 1; transform: translateY(0); } 25%, 100% { opacity: 0; transform: translateY(-14px); } }
  .frase { animation: frase 24s ease-in-out infinite; opacity: 0; }

  @keyframes ondula { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .ondula { animation: ondula 4s ease-in-out infinite; }
</style>
